version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Bare Conventional-Commit type. `include: scope` appends the dependency
      # scope, yielding `chore(deps):` / `chore(deps-dev):` — a single valid
      # scope. A paren-scope here (e.g. `chore(deps)`) would double up to
      # `chore(deps)(deps-dev):` and fail the "Commit lint (PR title)" gate
      # (governance.yml). See ARC-297.
      prefix: "chore"
      include: "scope"
    groups:
      types:
        patterns:
          - "@types/*"
      bun-stack:
        patterns:
          - "@types/bun"
          - "typescript"

  # Demo/docs Remotion project — isolated npm lockfile not covered by "/".
  # Added in ARC-288 so future remotion-family CVE bumps auto-generate.
  - package-ecosystem: "npm"
    directory: "/docs/remotion"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Bare type — see note above (ARC-297). `ci`/demo context is carried by
      # the `dependencies` label + directory, not a paren-scope in the title.
      prefix: "chore"
      include: "scope"
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      # Bare type — see note above (ARC-297). The `ci` label distinguishes
      # Actions bumps; the title stays single-scope (`chore(deps):`).
      prefix: "chore"
      include: "scope"
