name: Dependabot auto-merge

# Enables GitHub-native auto-merge on Dependabot PRs so they merge THE MOMENT
# all required checks are green and the required approval is present -- without
# a human clicking "merge" on each one. It does NOT bypass branch protection:
#   - `gh pr merge --auto` queues the merge and waits for every required status
#     check AND the required approving review. Nothing merges while CI is red or
#     an approval is missing.
#   - Only patch/minor (and grouped) updates are auto-queued. Major bumps are
#     left untouched for explicit human review.
# Prereqs handled OUTSIDE this file (gated, see ARC-270 Track B):
#   - repo setting `allow_auto_merge` must be enabled;
#   - the Dependabot approval policy (auto-approve bot identity vs. human batch
#     approval) is a CSO governance decision -- until it is set, PRs sit in
#     "auto-merge enabled, waiting for approval", which is still an improvement.

on:
  pull_request:
    branches: [main]

# Least privilege: only what `gh pr merge --auto` needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch/minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
