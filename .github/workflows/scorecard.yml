# OpenSSF Scorecard — supply-chain posture analysis.
#
# Runs the OpenSSF Scorecard checks (branch protection, token permissions,
# pinned dependencies, dangerous workflow patterns, ...) weekly and on every
# push to the default branch, then publishes the score to the public OpenSSF
# dashboard and keeps the SARIF as a workflow artifact.
#
# Trust model: top-level read-only; only the analysis job escalates to the two
# writes it needs (security-events for SARIF, id-token for the OIDC publish to
# the OpenSSF API — no long-lived secret). Every action is SHA-pinned and
# harden-runner runs first in non-blocking egress-audit mode.

name: Scorecard

on:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
