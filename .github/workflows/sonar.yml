name: SonarCloud

# Static analysis + coverage quality gate via SonarCloud.
#
# Fail-loud by design: the job ALWAYS runs and fails when SonarCloud is not
# working — a missing SONAR_TOKEN or a red quality gate both turn the required
# `SonarCloud` check red, so a broken/unconfigured analysis is never silent.
# Setup: import the repo on sonarcloud.io and add the SONAR_TOKEN repo secret
# (see README / docs/RELEASING.md).
#
# Exception: Dependabot-authored PRs. GitHub does NOT expose Actions secrets to
# workflows triggered by dependabot[bot] (they live in a separate Dependabot
# secrets store), so SONAR_TOKEN is unavoidably empty there and the fail-loud
# assert produced a guaranteed false red on every dependency bump. The analysis
# steps below therefore no-op on dependabot[bot] (job still concludes success,
# so the required `SonarCloud` check is satisfied). Human PRs and pushes keep
# the original fail-loud behavior. See ARC-297.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Assert SONAR_TOKEN is configured
        # Skip on Dependabot: Actions secrets are not available in that context,
        # so this fail-loud guard would false-positive. See header note.
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not set — SonarCloud cannot run. Add the repo secret (sonarcloud.io → My Account → Security)."
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.actor != 'dependabot[bot]'
        with:
          # Full history so SonarCloud can assign blame / new-code periods.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        if: github.actor != 'dependabot[bot]'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: bun install --frozen-lockfile
      - name: Tests with coverage (lcov)
        if: github.actor != 'dependabot[bot]'
        run: bun test --coverage --coverage-reporter=lcov
      - name: SonarCloud scan + quality gate
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
